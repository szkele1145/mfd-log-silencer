[[mods]]
modId="mfd_log_silencer"
version="1.4.1"
displayName="MFD Log Silencer"
logoFile="icon.png"
authors="szkele1145"
description='''
Hides the per-second INFO log spam of fixed Tweaked Controller
([MFD-FixedController] signals pos=... linked=... values={}) and of its
diagnostic mixins. Rules are logger / Java-package based (DISABLE=...), so they
work no matter which logger names a mod actually uses; WARN/ERROR always pass
through (configurable with KEEP=...). Configured in
config/mfd-log-silencer.properties, reloadable in game with /mfdlogsilencer.
'''

[[dependencies.mfd_log_silencer]]
    modId="neoforge"
    type="required"
    versionRange="[21.1.0,)"
    ordering="NONE"
    side="BOTH"

[[dependencies.mfd_log_silencer]]
    modId="minecraft"
    type="required"
    versionRange="[1.21.1]"
    ordering="NONE"
    side="BOTH"

[[dependencies.mfd_log_silencer]]
    modId="fixed_tweaked_controller"
    type="optional"
    versionRange="[1.4.0,)"
    ordering="AFTER"
    side="BOTH"
