modId="mfd_log_silencer"
version="1.2.5"
displayName="MFD Log Silencer"
logoFile="icon.png"
authors="szkele1145"
description='''
Silences the per-second INFO log spam of fixed Tweaked Controller
([Server] signals pos=... linked=... values={}). Only INFO/DEBUG logs of the
target logger are denied; WARN/ERROR pass through. Configurable via
config/mfd-log-silencer.properties and the /mfdlogsilencer command.
'''

