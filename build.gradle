import org.gradle.api.tasks.compile.JavaCompile

plugins {
    id 'java'
    id 'net.neoforged.moddev' version '2.0.78'
}

version = '1.4.0'
group = 'dev.szkele.mfdlogsilencer'

base {
    archivesName = 'mfd-log-silencer'
}

// Filename convention: modid-version-mc-loader.jar
def mcVer = '1.21.1'
def loader = 'neoforge'
jar {
    archiveFileName = "mfd-log-silencer-${project.version}-${mcVer}-${loader}.jar"
    manifest {
        attributes [
            'Specification-Title'   : 'mfd-log-silencer',
            'Specification-Version' : '1.0',
            'Implementation-Title'  : 'MFDFixedControllerLogSilencer',
            'Implementation-Version': project.version,
        ]
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

neoForge {
    version = '21.1.248'
    accessTransformers = []

    runs {
        configureEach {
            gameDirectory = file('run')
        }
        server {
            server()
        }
    }

    mods {
        mfdlogsilencer {
            sourceSet(sourceSets.main)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}
